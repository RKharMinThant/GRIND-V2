# Keep the Supabase free-tier project from auto-pausing.
# Free projects pause after 7 days without activity; this pings the REST API daily.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon public key (same value as VITE_SUPABASE_ANON_KEY)

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write # re-enable this workflow so GitHub's 60-day inactivity rule never disables it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          # RLS returns [] for anon, but the request still runs a real query against Postgres.
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
              "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not respond with 200 — the project may already be paused. Restore it in the dashboard."
          exit 1

      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
