# Evaluate notification rules and send any that are due — MANUAL RUNS ONLY.
#
# The hourly schedule lives in Supabase Cron (job push-dispatch-hourly). GitHub's own
# scheduler ran this "hourly" workflow about six times a day at random times, which
# made fixed-hour rules like the 23:00 rest-day check miss most days. Keep this for
# testing: Actions → Push notifications → Run workflow. It calls ?wait=1, so the log
# shows {users, evaluated, sent}.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co  (already set for keep-alive)
#   PUSH_CRON_SECRET   same value as the Supabase Edge Function secret of that name

name: Push notifications

on:
  workflow_dispatch:

concurrency:
  # A slow run must not overlap the next one
  group: push-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and send due notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$PUSH_CRON_SECRET" ]; then
            echo "::error::SUPABASE_URL / PUSH_CRON_SECRET secrets are not set"
            exit 1
          fi
          body=$(mktemp)
          status=$(curl -s -o "$body" -w '%{http_code}' -m 120 -X POST \
            "$SUPABASE_URL/functions/v1/push-dispatch?wait=1" \
            -H "x-cron-secret: $PUSH_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          # The summary is counts only — no message text, no user ids
          cat "$body"
          echo
          if [ "$status" != "200" ]; then
            echo "::error::push-dispatch returned HTTP $status"
            exit 1
          fi
