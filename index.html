<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!-- Status bar blends into the app when installed to the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GRIND" />
    <meta name="theme-color" content="#F3F5EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080A" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Sessions, progressive overload, and rest days — private by default."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRIND" />
    <meta property="og:title" content="GRIND — Show up. Log the work. Repeat." />
    <meta
      property="og:description"
      content="Sessions, progressive overload, and rest days — private by default."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRIND — Show up. Log the work. Repeat." />
    <meta
      name="twitter:description"
      content="Sessions, progressive overload, and rest days — private by default."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>GRIND — Show up. Log the work. Repeat.</title>
    <!-- Prevent theme flash before React boots -->
    <script>
      (function () {
        try {
          var key = 'grind_theme'
          var pref = localStorage.getItem(key) || 'system'
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          // Own tag (no media) so the light/dark defaults above stay intact;
          // the last matching theme-color wins, and this one follows the app's theme.
          var meta = document.querySelector('meta[name="theme-color"]:not([media])')
          if (!meta) {
            meta = document.createElement('meta')
            meta.setAttribute('name', 'theme-color')
            document.head.appendChild(meta)
          }
          meta.setAttribute('content', dark ? '#07080A' : '#F3F5EC')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
